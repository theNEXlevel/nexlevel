version: '3.8'

services:
  shop:
    build:
      context: ../..
      dockerfile: apps/shop/Dockerfile
    container_name: nexlevel-shop
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - nexlevel-network

networks:
  nexlevel-network:
    driver: bridge
