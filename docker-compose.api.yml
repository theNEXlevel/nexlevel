version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexlevel-api
    ports:
      - '3333:3333'
    environment:
      - HOST=0.0.0.0
      - PORT=3333
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - nexlevel-network

networks:
  nexlevel-network:
    driver: bridge
