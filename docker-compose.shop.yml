version: '3.8'

services:
  shop:
    build:
      context: .
      dockerfile: apps/shop/Dockerfile
    container_name: nexlevel-shop
    ports:
      - '${HOST_PORT:-4000}:4000'
    environment:
      - PORT=4000
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - nexlevel-network

networks:
  nexlevel-network:
    driver: bridge
